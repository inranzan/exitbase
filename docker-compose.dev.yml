services:
    # Neon Local proxy container: connects to Neon Cloud
    neon-local:
        image: neondatabase/neon_local:latest
        container_name: exitbase_neon_local
        restart: unless-stopped
        ports:
            - "5432:5432"
        env_file:
            - .env.development

    # Exitbase API application
    app:
        build:
            context: .
            dockerfile: Dockerfile
            target: development
        container_name: exitbase_app_dev
        restart: unless-stopped
        ports:
            - "${PORT:-5000}:5000"
        env_file:
            - .env.development
        volumes:
            - .:/app
            - /app/node_modules
            # Persist dev logs locally
            - ./logs:/app/logs
        depends_on:
            - neon-local
